# Formatting, lints and tests of the engine. Needs no Minecraft files: the
# engine is tested against an in-memory world and a model of the vanilla
# client. The Horizon server build and the live smoke test are not run here
# (they need a Horizon checkout, and the live test the owner's 26.3 files).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --release
      - name: Python tools compile
        run: python3 -m py_compile tools/build_server.py tools/smoke_test.py
